services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_password
      MYSQL_DATABASE: ticket_db
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.0.40
    environment:
      MYSQL_DATABASE: ticket_db
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 30
